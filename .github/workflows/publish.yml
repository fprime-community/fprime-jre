name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version (or tag) to publish instead of the one derived from git
        type: string
        required: false
        default: ""

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Pin to the release tag; git describe may pick another tag on the same commit
      version: ${{ github.event.release.tag_name || inputs.version }}

  publish:
    name: Publish to TestPyPI and PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -l dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
      # The action writes attestations into dist; clear them so the PyPI upload generates its own
      - name: Clean-Up Attestations
        run: rm -f dist/*.attestation
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
